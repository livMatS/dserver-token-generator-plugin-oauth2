[build-system]
requires = ["flit_scm"]
build-backend = "flit_scm:buildapi"

[project]
name = "dserver-token-generator-plugin-oauth2"
description = "OAuth 2.0 token generator plugin for dserver"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Lars Pastewka", email = "lars.pastewka@imtek.uni-freiburg.de"},
    {name = "Johannes L. Hörmann", email = "johannes.laurin@gmail.com"},
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "flask>=2.0.0",
    "flask-smorest>=0.40.0",
    "authlib>=1.2.0",
    "httpx>=0.24.0",
    "PyJWT>=2.0.0",
    "cryptography>=3.4.0",
    "dservercore>0.22.0",
]

[project.optional-dependencies]
test = [
    "dservercore",
    "pytest",
    "pytest-cov",
    "responses",
]

[project.urls]
Repository = "https://github.com/livMatS/dserver-token-generator-plugin-oauth2"

[project.entry-points."dservercore.extension"]
oauth2 = "dserver_token_generator_plugin_oauth2:OAuth2TokenGeneratorPlugin"

[project.entry-points."flask.commands"]
oauth2 = "dserver_token_generator_plugin_oauth2.cli:oauth2_cli"

[tool.flit.module]
name = "dserver_token_generator_plugin_oauth2"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
write_to = "dserver_token_generator_plugin_oauth2/version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
